onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

# AeroSpace forwards directional focus through this client so two windows
# attached to the same session use their own selected pane. These reserved
# keys are generated by focus-pane-or-window.sh on macOS.

[[keys.command]]
key = "f13"
type = "shell"
command = "~/.config/aerospace/focus-pane-or-window.sh left --from-herdr"

[[keys.command]]
key = "f14"
type = "shell"
command = "~/.config/aerospace/focus-pane-or-window.sh down --from-herdr"

[[keys.command]]
key = "f15"
type = "shell"
command = "~/.config/aerospace/focus-pane-or-window.sh up --from-herdr"

[[keys.command]]
key = "f16"
type = "shell"
command = "~/.config/aerospace/focus-pane-or-window.sh right --from-herdr"
