# kitty configuration.
#
# The full reference file of kitty is about 112 kB, and every line in it is a
# comment. This file holds only the settings that this machine changes. Read
# the reference with "kitty --help" or at https://sw.kovidgoyal.net/kitty/conf/
#
# hypr-background-opacity.conf is NOT in this repository. ~/.config/hypr/
# monitors.lua writes that file, and monitors.lua stays out of the repository
# because it describes the monitors of one machine. The include below therefore
# points to a local file. kitty ignores an include that it cannot find, so this
# configuration also works on a machine without Hyprland.

background_opacity 0.7

include hypr-background-opacity.conf
