[[mgr.prepend_keymap]]
on   = [ "c", "p" ]
run  = "shell -- 'wl-copy < \"$1\"'"
desc = "Copy image to clipboard"

[[mgr.prepend_keymap]]
on = ["g","n"]
run = "cd /mnt/nas-hdd/"
desc = "Go to nas"

[[mgr.prepend_keymap]]
on = ["g","m"]
run = "cd /mnt/"
desc = "Go to mount"

[[mgr.prepend_keymap]]
on = [ "1" ]
run = "plugin relative-motions 1"
desc = "Move in relative steps"

