# AeroSpace: a tiling window manager for macOS, in the spirit of i3.
# This file starts from the upstream default configuration.
#
# Reload after an edit:  aerospace reload-config
# All commands:          https://nikitabobko.github.io/AeroSpace/commands
# Full guide:            https://nikitabobko.github.io/AeroSpace/guide

# Start AeroSpace when you log in.
start-at-login = true

# Normalization keeps the window tree flat and predictable.
# See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# The layout for a new workspace: 'tiles' or 'accordion'.
default-root-container-layout = 'tiles'

# 'auto' means: wide monitors get horizontal, tall monitors get vertical.
default-root-container-orientation = 'auto'

# The visible gap between the windows of an accordion.
accordion-padding = 30

# Move the mouse to the focused monitor when the focus changes monitors.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

# The main binding mode. Keys use these modifier names:
# alt (option), cmd, ctrl, shift.
[mode.main.binding]

# Terminal
alt-enter = 'exec-and-forget open -na Ghostty'

# Layouts
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move the focused window
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Workspaces
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Move the focused window to a workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# Jump between the two most recent workspaces
alt-tab = 'workspace-back-and-forth'

# Move the whole workspace to the next monitor
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Enter the service mode below
alt-shift-semicolon = 'mode service'

# The service mode holds the rare commands, so they cannot fire by accident.
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset the layout
f = ['layout floating tiling', 'mode main'] # toggle floating
backspace = ['close-all-windows-but-current', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']
