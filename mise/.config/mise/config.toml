# Single source of truth for language runtimes and CLI tools.
# paru/pacman owns only the system layer: kernel, drivers, hyprland,
# fish, stow, rustup, mise itself.
#
#   mise install   install everything listed here
#   mise up        upgrade every tool to its newest matching version
#
# rust is deliberately absent: rustup owns it, because components
# (clippy, rust-analyzer) and cross targets need rustup itself.
#
# java is deliberately absent too: paru installs jdk17-openjdk, reached only
# through JAVA_HOME so Gradle gets JDK 17 while `java` on PATH stays at the
# system default. mise only offers openjdk-17.0.2, unpatched since 2022.

[tools]
# language runtimes
node = "lts"
pnpm = "latest"
python = "latest"
uv = "latest"
go = "latest"
ruby = "latest"
erlang = "latest"
elixir = "latest"

# shell and prompt
starship = "latest"
zoxide = "latest"
fzf = "latest"
usage = "latest"
# herdr gets the local pane-mute patch: the postinstall hook rebuilds the
# release that mise selected from source. A failed hook keeps the previous
# version selected. See herdr-local/README.md. zig is the build dependency;
# keep it at the series that the Herdr release asks for.
zig = "0.16"
herdr = { version = "latest", depends = ["zig"], postinstall = 'sh "${MISE_CONFIG_FILE%/*}/herdr-local/postinstall.sh"' }

# file and text tools
eza = "latest"
bat = "latest"
fd = "latest"
ripgrep = "latest"
yazi = "latest"
yq = "latest"
taplo = "latest"

# git and containers
gh = "latest"
delta = "latest"
lazygit = "latest"
lazydocker = "latest"

# editor and agents
neovim = "latest"
claude = "latest"
codex = "latest"
pi = "latest"

# Idiomatic version files (.ruby-version, .nvmrc, go.mod-era files, ...).
# mise ignores these unless the tool is named here, so a repo pinning
# ruby 3.4.9 silently got the global `ruby = "latest"` instead.
# Every tool below was verified to read its file with this mise version;
# erlang, scala, sbt and yarn have no idiomatic file support at all.
#
# java and rust are listed for completeness but contradict the notes above:
# rustup owns rust and paru owns the JDK. Drop them from the list if a repo
# with rust-toolchain.toml or .java-version starts nagging about installs.
[settings]
# mise-versions.jdx.dev serves ready-made version lists, so `latest` resolves
# without a call to GitHub. Its codex list stopped on 2026-09-01 at
# 0.153.0-alpha.2. Thus `latest` stayed 0.152.0, `mise outdated` reported
# "up to date" while 0.153.4 was installed, and the minimum_release_age
# warning blamed the 24 h hold for a gap of 10 days.
# With the host off, each backend asks its own source. The 1 h
# fetch_remote_versions_cache keeps the cost of that low.
use_versions_host = false

idiomatic_version_file_enable_tools = [
  "bun",       # .bun-version
  "crystal",   # .crystal-version
  "deno",      # .deno-version
  "dotnet",    # global.json  -> sdk.version
  "elixir",    # .exenv-version
  "go",        # .go-version
  "java",      # .java-version
  "node",      # .node-version, .nvmrc
  "python",    # .python-version, .python-versions
  "ruby",      # .ruby-version, Gemfile -> ruby directive
  "rust",      # rust-toolchain.toml -> toolchain.channel
  "swift",     # .swift-version
  "terraform", # .terraform-version
  "zig",       # .zig-version
]

[settings.github]
credential_command = 'gh auth token --hostname "$MISE_CREDENTIAL_HOST"'
